<svg xmlns="http://www.w3.org/2000/svg" width="460" height="1000" viewBox="0 0 460 1000">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="black"/>
    </marker>
  </defs>

  <style>
    text { font-family: monospace; font-size: 11px; fill: black; }
    .lbl { font-size: 10px; fill: #333; }
  </style>

  <!-- Background -->
  <rect width="460" height="1000" fill="white"/>

  <!-- Title -->
  <text x="230" y="18" text-anchor="middle" font-size="13" font-weight="bold">spiLCD - Flowchart</text>
  <text x="230" y="34" text-anchor="middle" font-size="9" fill="#666">INIT_MEM[9:0] — bit[9]: 0=cmd, 1=delay | bit[8]: DC | bits[7:0]: data</text>

  <!-- START -->
  <rect x="180" y="45" width="100" height="30" rx="15" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="230" y="64" text-anchor="middle">RESET / START</text>
  <line x1="230" y1="75" x2="230" y2="95" stroke="black" marker-end="url(#arrow)"/>

  <!-- INIT A_COUNT -->
  <rect x="160" y="95" width="140" height="30" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="230" y="114" text-anchor="middle">A_COUNT = 0</text>
  <line x1="230" y1="125" x2="230" y2="145" stroke="black" marker-end="url(#arrow)"/>

  <!-- READ INIT_MEM -->
  <rect x="140" y="145" width="180" height="30" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="230" y="164" text-anchor="middle">entry = INIT_MEM[A_COUNT]</text>
  <line x1="230" y1="175" x2="230" y2="195" stroke="black" marker-end="url(#arrow)"/>

  <!-- IS DELAY? -->
  <polygon points="230,195 310,220 230,245 150,220" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="230" y="224" text-anchor="middle">entry[9] == 1?</text>
  <text x="315" y="214" text-anchor="start" class="lbl">CMD</text>
  <text x="238" y="262" text-anchor="start" class="lbl">DELAY</text>

  <!-- CMD path: right then down into SEND block -->
  <line x1="310" y1="220" x2="360" y2="220" stroke="black"/>
  <line x1="360" y1="220" x2="360" y2="280" stroke="black" marker-end="url(#arrow)"/>

  <!-- DELAY path: down into D_COUNT block -->
  <line x1="230" y1="245" x2="230" y2="280" stroke="black" marker-end="url(#arrow)"/>

  <!-- CMD: SEND SPI -->
  <rect x="270" y="280" width="170" height="30" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="355" y="294" text-anchor="middle">SEL=0, INIT_TX=1</text>
  <text x="355" y="306" text-anchor="middle" class="lbl">SPI_TX &lt;&lt; entry[8:0]</text>
  <line x1="355" y1="310" x2="355" y2="330" stroke="black" marker-end="url(#arrow)"/>

  <!-- CMD: WAIT DONE_TX (NO loops back, merges into CMD entry line) -->
  <polygon points="355,330 415,355 355,380 295,355" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="355" y="359" text-anchor="middle">DONE_TX?</text>
  <text x="418" y="349" text-anchor="start" class="lbl">NO</text>
  <line x1="415" y1="355" x2="440" y2="355" stroke="black"/>
  <line x1="440" y1="355" x2="440" y2="260" stroke="black"/>
  <line x1="440" y1="260" x2="360" y2="260" stroke="black"/>
  <text x="363" y="398" text-anchor="start" class="lbl">YES</text>
  <line x1="355" y1="380" x2="355" y2="435" stroke="black"/>
  <line x1="355" y1="435" x2="300" y2="435" stroke="black" marker-end="url(#arrow)"/>

  <!-- DELAY: START D_COUNT -->
  <rect x="140" y="280" width="160" height="30" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="220" y="294" text-anchor="middle">D_COUNT = entry[7:0]</text>
  <text x="220" y="306" text-anchor="middle" class="lbl">S_DELAY = 1</text>
  <line x1="220" y1="310" x2="220" y2="330" stroke="black" marker-end="url(#arrow)"/>

  <!-- DELAY: WAIT DONE_DELAY (NO loops back into block left edge) -->
  <polygon points="220,330 280,355 220,380 160,355" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="220" y="359" text-anchor="middle">DONE_DELAY?</text>
  <text x="112" y="349" text-anchor="start" class="lbl">NO</text>
  <line x1="160" y1="355" x2="110" y2="355" stroke="black"/>
  <line x1="110" y1="355" x2="110" y2="295" stroke="black"/>
  <line x1="110" y1="295" x2="140" y2="295" stroke="black" marker-end="url(#arrow)"/>
  <text x="228" y="398" text-anchor="start" class="lbl">YES</text>
  <line x1="220" y1="380" x2="220" y2="420" stroke="black" marker-end="url(#arrow)"/>

  <!-- MERGE: A_COUNT++ -->
  <rect x="160" y="420" width="140" height="30" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="230" y="439" text-anchor="middle">A_COUNT++</text>
  <line x1="230" y1="450" x2="230" y2="470" stroke="black" marker-end="url(#arrow)"/>

  <!-- INIT DONE? (NO loops back on the LEFT into READ block) -->
  <polygon points="230,470 310,495 230,520 150,495" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="230" y="499" text-anchor="middle">A_COUNT == MAX?</text>
  <text x="90" y="489" text-anchor="start" class="lbl">NO</text>
  <line x1="150" y1="495" x2="75" y2="495" stroke="black"/>
  <line x1="75" y1="495" x2="75" y2="160" stroke="black"/>
  <line x1="75" y1="160" x2="140" y2="160" stroke="black" marker-end="url(#arrow)"/>
  <text x="238" y="538" text-anchor="start" class="lbl">YES</text>
  <line x1="230" y1="520" x2="230" y2="550" stroke="black" marker-end="url(#arrow)"/>

  <!-- SEND 0xDC -->
  <rect x="140" y="550" width="180" height="30" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="230" y="564" text-anchor="middle">SEL=1, INIT_TX=1</text>
  <text x="230" y="576" text-anchor="middle" class="lbl">SPI_TX &lt;&lt; {1, 0xDC}</text>
  <line x1="230" y1="580" x2="230" y2="600" stroke="black" marker-end="url(#arrow)"/>

  <!-- WAIT DONE_TX 2 -->
  <polygon points="230,600 290,625 230,650 170,625" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="230" y="629" text-anchor="middle">DONE_TX?</text>
  <text x="295" y="619" text-anchor="start" class="lbl">NO</text>
  <line x1="290" y1="625" x2="360" y2="625" stroke="black"/>
  <line x1="360" y1="625" x2="360" y2="565" stroke="black"/>
  <line x1="360" y1="565" x2="320" y2="565" stroke="black" marker-end="url(#arrow)"/>
  <text x="238" y="668" text-anchor="start" class="lbl">YES</text>
  <line x1="230" y1="650" x2="230" y2="680" stroke="black" marker-end="url(#arrow)"/>

  <!-- LOOP: SRC_VALID? (NO waits, merges back into entry line) -->
  <polygon points="230,680 310,705 230,730 150,705" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="230" y="709" text-anchor="middle">SRC_VALID == 1?</text>
  <text x="313" y="699" text-anchor="start" class="lbl">NO (wait)</text>
  <line x1="310" y1="705" x2="345" y2="705" stroke="black"/>
  <line x1="345" y1="705" x2="345" y2="665" stroke="black"/>
  <line x1="345" y1="665" x2="230" y2="665" stroke="black"/>
  <text x="238" y="748" text-anchor="start" class="lbl">YES</text>
  <line x1="230" y1="730" x2="230" y2="760" stroke="black" marker-end="url(#arrow)"/>

  <!-- SEND PIXEL -->
  <rect x="140" y="760" width="180" height="30" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="230" y="774" text-anchor="middle">SEL=2, SRC_RDY=1, INIT_TX=1</text>
  <text x="230" y="786" text-anchor="middle" class="lbl">SPI_TX &lt;&lt; DMA data (DC=1)</text>
  <line x1="230" y1="790" x2="230" y2="810" stroke="black" marker-end="url(#arrow)"/>

  <!-- WAIT DONE_TX 3 -->
  <polygon points="230,810 290,835 230,860 170,835" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="230" y="839" text-anchor="middle">DONE_TX?</text>
  <text x="295" y="829" text-anchor="start" class="lbl">NO</text>
  <line x1="290" y1="835" x2="360" y2="835" stroke="black"/>
  <line x1="360" y1="835" x2="360" y2="775" stroke="black"/>
  <line x1="360" y1="775" x2="320" y2="775" stroke="black" marker-end="url(#arrow)"/>
  <text x="238" y="878" text-anchor="start" class="lbl">YES</text>
  <line x1="230" y1="860" x2="230" y2="890" stroke="black" marker-end="url(#arrow)"/>

  <!-- SRC_LAST? (NO continues frame, merges back into entry line) -->
  <polygon points="230,890 310,915 230,940 150,915" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="230" y="919" text-anchor="middle">SRC_LAST == 1?</text>
  <text x="313" y="909" text-anchor="start" class="lbl">NO</text>
  <line x1="310" y1="915" x2="345" y2="915" stroke="black"/>
  <line x1="345" y1="915" x2="345" y2="870" stroke="black"/>
  <line x1="345" y1="870" x2="230" y2="870" stroke="black"/>

  <!-- YES: new framebuffer pass, loops back into SRC_VALID left vertex -->
  <text x="238" y="956" text-anchor="start" class="lbl">YES — nueva pasada</text>
  <line x1="230" y1="940" x2="230" y2="965" stroke="black"/>
  <line x1="230" y1="965" x2="80" y2="965" stroke="black"/>
  <line x1="80" y1="965" x2="80" y2="705" stroke="black"/>
  <line x1="80" y1="705" x2="150" y2="705" stroke="black" marker-end="url(#arrow)"/>
  <text x="85" y="982" text-anchor="start" class="lbl">SRC_LAST: DMA (loop) reinicia el framebuffer</text>
</svg>
