<svg xmlns="http://www.w3.org/2000/svg" width="2670" height="1400" viewBox="0 80 2670 1400">
<title>Periférico de texto y sprites · registros e interfaz femtoRV</title>
<desc>Propuesta con dirección, dato y WE persistentes, siguiendo los CSRStorage conectados a ws2812_periph en colorlight_5a_75e.v. Los dos WE son registros escritos por software, no pulsos del bus. Direcciones de registros propuestas, no tomadas del mapa LiteX. No representa RTL implementado.</desc>
<defs>
 <marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#247347"/></marker>
 <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#38679b"/></marker>
 <marker id="k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#222"/></marker>
 <style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#151515;font-size:21px}
 .title{font-size:29px;font-weight:bold}.head{font-size:24px;font-weight:bold}.small{font-size:18px}.code{font-family:monospace;font-size:20px}
 .green{fill:#247347}.blue{fill:#38679b}
 .reg{fill:#e1f1ee;stroke:#333;stroke-width:1.5}.dec{fill:#d8e6f1;stroke:#333;stroke-width:1.5}.core{fill:#dce5ee;stroke:#333;stroke-width:1.5}.addr{fill:#faf8dd;stroke:#333;stroke-width:1.2}
 .gw{fill:none;stroke:#247347;stroke-width:3;marker-end:url(#g)}.bw{fill:none;stroke:#38679b;stroke-width:2;marker-end:url(#b)}.kw{fill:none;stroke:#222;stroke-width:1.8;marker-end:url(#k)}
 .gj{fill:none;stroke:#247347;stroke-width:3}.bj{fill:none;stroke:#38679b;stroke-width:2}
 </style>
</defs>
