<rect x="580" y="95" width="1650" height="1260" fill="white" stroke="#333" stroke-width="2"/>
<text x="1420" y="132" class="head">peripheral_led_panel · periférico completo</text>
<rect x="1700" y="150" width="500" height="1175" fill="#f6f8fa" stroke="#617487" stroke-width="1.5"/>
<text x="1720" y="177" class="small">led_panel_4k · controlador HUB75</text>

<rect x="25" y="105" width="465" height="920" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="42" y="140" class="head">femtoRV · ASM</text>
<text x="42" y="177" class="code">LED_BASE: pendiente de asignar</text>
<g class="code green">
 <text x="42" y="217" class="code green">.equ TEXT_ADDR,   0x04</text>
 <text x="42" y="249" class="code green">.equ TEXT_DATA,   0x08</text>
 <text x="42" y="281" class="code green">.equ SPRITE_ADDR, 0x0C</text>
 <text x="42" y="313" class="code green">.equ SPRITE_DATA, 0x10</text>
 <text x="42" y="345" class="code green">.equ TEXT_WE,     0x14</text>
 <text x="42" y="377" class="code green">.equ SPRITE_WE,   0x18</text>
</g>
<text x="42" y="425" class="code">li t0, LED_BASE</text>
<text x="42" y="457" class="code green">sw zero, TEXT_WE(t0)</text>
<text x="42" y="489" class="code green">sw zero, TEXT_ADDR(t0)</text>
<text x="42" y="521" class="code">li t2, 0x07C1</text>
<text x="42" y="553" class="code green">sw t2, TEXT_DATA(t0)</text>
<text x="42" y="585" class="code">li t1, 1</text>
<text x="42" y="617" class="code green">sw t1, TEXT_WE(t0)</text>
<text x="42" y="649" class="small">[espera: cubrir captura en negedge clk1]</text>
<text x="42" y="681" class="code green">sw zero, TEXT_WE(t0)</text>
<text x="42" y="729" class="code green">sw zero, SPRITE_WE(t0)</text>
<text x="42" y="761" class="code green">sw zero, SPRITE_ADDR(t0)</text>
<text x="42" y="793" class="code">li t2, 0x02201008</text>
<text x="42" y="825" class="code green">sw t2, SPRITE_DATA(t0)</text>
<text x="42" y="857" class="code green">sw t1, SPRITE_WE(t0)</text>
<text x="42" y="889" class="small">[espera: cubrir captura en negedge clk1]</text>
<text x="42" y="921" class="code green">sw zero, SPRITE_WE(t0)</text>
<text x="42" y="965" class="small">Espera dimensionada según los relojes.</text>
<text x="42" y="997" class="small">Dirección y dato estables mientras WE=1.</text>

