<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1060" viewBox="0 0 1660 1060">
  <title>HUB75: jerarquía implementada del generador de texto y la mezcla</title>
  <desc>text_overlay contiene text_memory y text_mix. text_memory contiene dos RAM de texto, dos ROM de fuentes y dos bloques text_color con sus paletas. El mux BCM existente queda fuera del overlay. Las conexiones internas se detallan en el pie.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#344454"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}
      .title{font-size:25px;font-weight:bold}
      .heading{font-size:20px;font-weight:bold}
      .label{font-size:17px;font-weight:bold}
      .body{font-size:16px}
      .small{font-size:14px;fill:#455463}
      .code{font-family:monospace;font-size:15px}
      .outline{fill:#ffffff;stroke:#344454;stroke-width:2}
      .group{fill:#f6f8fa;stroke:#617487;stroke-width:1.6}
      .ram{fill:#f6eeee;stroke:#617487;stroke-width:1.4}
      .logic{fill:#edf3f8;stroke:#617487;stroke-width:1.4}
      .palette{fill:#ffffff;stroke:#617487;stroke-width:1.2}
      .bus{fill:none;stroke:#344454;stroke-width:2.4;marker-end:url(#arrow)}
      .wire{fill:none;stroke:#344454;stroke-width:1.6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1660" height="1060" fill="#ffffff"/>
  <text x="35" y="38" class="title">HUB75 · generador de texto y mezcla implementados</text>

  <rect x="300" y="65" width="1050" height="675" class="outline"/>
  <text x="320" y="98" class="heading">text_overlay</text>
  <text x="1325" y="98" text-anchor="end" class="small">Subsistema nuevo · sin modificar el barrido</text>

  <text x="35" y="115" class="label">Imagen existente</text>
  <path d="M35 140 H1000 V225 H1050" class="bus"/>

  <text x="35" y="425" class="label">Dirección de píxel</text>
  <path d="M35 450 H340" class="bus"/>
  <text x="35" y="540" class="label">Escritura y reloj</text>
  <path d="M35 565 H340" class="bus"/>

  <rect x="340" y="180" width="580" height="510" class="group"/>
  <text x="360" y="213" class="heading">TEXT_MEMORY : text_memory</text>

  <rect x="360" y="240" width="170" height="125" class="ram"/>
  <text x="445" y="278" text-anchor="middle" class="label">txt_top</text>
  <text x="445" y="305" text-anchor="middle" class="body">text_ram · 32 × 15</text>
  <text x="445" y="335" text-anchor="middle" class="small">Mitad superior</text>

  <rect x="545" y="240" width="165" height="125" class="logic"/>
  <text x="627" y="278" text-anchor="middle" class="label">font_top</text>
  <text x="627" y="305" text-anchor="middle" class="body">font_rom · 1024 × 8</text>
  <text x="627" y="335" text-anchor="middle" class="small">Combinacional</text>

  <rect x="725" y="240" width="175" height="125" class="logic"/>
  <text x="812" y="268" text-anchor="middle" class="label">color_top</text>
  <text x="812" y="290" text-anchor="middle" class="small">text_color</text>
  <rect x="740" y="305" width="145" height="46" class="palette"/>
  <text x="812" y="324" text-anchor="middle" class="small">PALETTE</text>
  <text x="812" y="343" text-anchor="middle" class="small">text_palette · 16 × 12</text>

  <rect x="360" y="415" width="170" height="125" class="ram"/>
  <text x="445" y="453" text-anchor="middle" class="label">txt_bot</text>
  <text x="445" y="480" text-anchor="middle" class="body">text_ram · 32 × 15</text>
  <text x="445" y="510" text-anchor="middle" class="small">Mitad inferior</text>

  <rect x="545" y="415" width="165" height="125" class="logic"/>
  <text x="627" y="453" text-anchor="middle" class="label">font_bot</text>
  <text x="627" y="480" text-anchor="middle" class="body">font_rom · 1024 × 8</text>
  <text x="627" y="510" text-anchor="middle" class="small">Combinacional</text>

  <rect x="725" y="415" width="175" height="125" class="logic"/>
  <text x="812" y="443" text-anchor="middle" class="label">color_bot</text>
  <text x="812" y="465" text-anchor="middle" class="small">text_color</text>
  <rect x="740" y="480" width="145" height="46" class="palette"/>
  <text x="812" y="499" text-anchor="middle" class="small">PALETTE</text>
  <text x="812" y="518" text-anchor="middle" class="small">text_palette · 16 × 12</text>

  <rect x="360" y="585" width="250" height="78" class="ram"/>
  <text x="485" y="616" text-anchor="middle" class="label">Registro de coordenadas</text>
  <text x="485" y="642" text-anchor="middle" class="small">Una etapa registrada</text>
  <rect x="630" y="585" width="270" height="78" class="logic"/>
  <text x="765" y="616" text-anchor="middle" class="label">Direccionamiento y escritura</text>
  <text x="765" y="642" text-anchor="middle" class="small">Selección independiente de mitad</text>

  <path d="M920 385 H1050" class="bus"/>

  <rect x="1050" y="180" width="270" height="510" class="group"/>
  <text x="1185" y="213" text-anchor="middle" class="heading">MIX : text_mix</text>
  <rect x="1070" y="285" width="230" height="130" class="logic"/>
  <text x="1185" y="333" text-anchor="middle" class="label">Mux RGB444 superior</text>
  <text x="1185" y="365" text-anchor="middle" class="small">Texto o imagen</text>
  <rect x="1070" y="465" width="230" height="130" class="logic"/>
  <text x="1185" y="513" text-anchor="middle" class="label">Mux RGB444 inferior</text>
  <text x="1185" y="545" text-anchor="middle" class="small">Texto o imagen</text>

  <path d="M1320 440 H1420" class="bus"/>
  <rect x="1420" y="385" width="185" height="110" class="outline"/>
  <text x="1512" y="425" text-anchor="middle" class="label">mux_led</text>
  <text x="1512" y="453" text-anchor="middle" class="small">BCM existente</text>
  <path d="M1605 440 H1640" class="bus"/>
  <path d="M1512 575 V495" class="wire"/>
  <text x="1512" y="613" text-anchor="middle" class="small">Fuera de text_overlay</text>

  <rect x="35" y="780" width="1590" height="245" fill="#f6f8fa" stroke="#617487" stroke-width="1.2"/>
  <text x="55" y="810" class="heading">Conexiones y temporización</text>
  <text x="55" y="840" class="code">Entrada de imagen: img[23:0], ya registrada por MEMORY existente. Salida hacia mux_led: data[23:0].</text>
  <text x="55" y="866" class="code">Dirección y escritura: pix_addr[10:0], we, waddr[5:0], wdata[14:0]; clk = clk1.</text>
  <text x="55" y="892" class="code">TEXT_MEMORY → MIX: txt[23:0], txt_on0, txt_on1. Orden RGB: {r0,g0,b0,r1,g1,b1}, cuatro bits por color.</text>
  <text x="55" y="918" class="code">Ruta interna por mitad: RAM → font_rom ({code,gy}) → line[gx] → selección fg/bg → paleta RGB444.</text>
  <text x="55" y="944" class="code">cell_addr = {pix_addr[10:9],pix_addr[5:3]}; gx = pix_addr[2:0]; gy = pix_addr[8:6].</text>
  <text x="55" y="970" class="code">RAM y coordenadas: negedge clk1. Fuente, color, paleta y mezcla: combinacionales. txt_on = bit | (bg != 0).</text>
  <text x="55" y="996" class="code">Entrada externa del mux BCM: index[1:0]. Salida al panel: {R0,G0,B0,R1,G1,B1}. Sin CPU ni cruce de reloj.</text>
  <text x="35" y="1048" class="small">Jerarquía contrastada con los siete módulos Verilog. Las conexiones entre funciones internas se describen en el pie para no cruzar bloques.</text>
</svg>
