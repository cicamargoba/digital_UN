<path d="M1280 410 V327" class="line"/>
<text x="1280" y="438" class="port" text-anchor="middle">gx[2:0] (3 bits)</text>
<polygon points="1420,185 1505,210 1505,340 1420,365" fill="#f7f7f7" stroke="#385333" stroke-width="2.5"/>
<text x="1462.5" y="282" class="name" text-anchor="middle">2:1</text>
<text x="1432" y="227" class="tiny" text-anchor="start">fg (4)</text>
<text x="1432" y="326" class="tiny" text-anchor="start">bg (4)</text>
<path d="M1320 270 H1360 V405 H1462 V352" class="line"/>
<circle cx="1360" cy="405" r="4" fill="#111"/>
<path d="M1505 270 H1600" class="bus"/>
