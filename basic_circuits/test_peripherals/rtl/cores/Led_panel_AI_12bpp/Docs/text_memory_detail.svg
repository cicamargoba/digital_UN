<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1400" viewBox="0 0 2100 1400">
<title>text_memory: caminos de texto superior e inferior y anchos de señal</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#111"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:27px;font-weight:bold}.name{font-size:23px;font-weight:bold}.port{font:17px monospace}.small{font-size:17px;fill:#414850}.tiny{font:15px monospace}.line{fill:none;stroke:#111;stroke-width:2;marker-end:url(#arrow)}.bus{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}</style></defs><rect width="2100" height="1400" fill="white"/>
<text x="35" y="38" class="title" text-anchor="start">text_memory · RAM de texto, fuente, selección de píxel y color</text>
<path d="M35 520 H300" class="bus"/>
<circle cx="300" cy="520" r="4" fill="#111"/>
<text x="35" y="498" class="port" text-anchor="start">PIX_ADDR[10:0] (11 bits)</text>
<path d="M300 520 V250 M300 520 V670" fill="none" stroke="#111" stroke-width="3"/>
<path d="M300 250 H420" class="bus"/>
<path d="M300 670 H420" class="bus"/>
<text x="35" y="204" class="port" text-anchor="start">cell_addr[4:0] (5 bits)</text>
<text x="35" y="230" class="tiny" text-anchor="start">{PIX_ADDR[10:9], PIX_ADDR[5:3]}</text>
<text x="35" y="624" class="port" text-anchor="start">cell_addr[4:0] (5 bits)</text>
<text x="35" y="650" class="tiny" text-anchor="start">{row[4:3], col[5:3]}</text>
<text x="35" y="556" class="port" text-anchor="start">row = PIX_ADDR[10:6]</text>
<text x="35" y="584" class="port" text-anchor="start">col = PIX_ADDR[5:0]</text>
<rect x="420" y="145" width="240" height="210" fill="#f9dedd" stroke="#111" stroke-width="2"/>
<text x="540" y="180" class="name" text-anchor="middle">txt_top · 32 × 15</text>
<text x="540" y="211" class="small" text-anchor="middle">Filas de texto 0–3</text>
<text x="540" y="247" class="small" text-anchor="middle">text_ram</text>
<text x="540" y="282" class="small" text-anchor="middle">Lectura registrada</text>
<text x="540" y="320" class="small" text-anchor="middle">Escribe si waddr[5]=0</text>
<path d="M540 410 V355" class="line"/>
<text x="540" y="438" class="tiny" text-anchor="middle">we_top (1), waddr[4:0] (5)</text>
<text x="540" y="462" class="tiny" text-anchor="middle">wdata[14:0] (15)</text>
<rect x="850" y="145" width="250" height="210" fill="#fcfbe2" stroke="#111" stroke-width="2"/>
<text x="975" y="180" class="name" text-anchor="middle">font_top · 1024 × 8</text>
<text x="975" y="216" class="small" text-anchor="middle">font_rom · combinacional</text>
<text x="975" y="270" class="port" text-anchor="middle">{cell_top[6:0], gy}</text>
<text x="975" y="312" class="port" text-anchor="middle">addr[9:0] · 10 bits</text>
<path d="M660 270 H850" class="bus"/>
<text x="750" y="253" class="tiny" text-anchor="middle">cell_top[6:0] (7)</text>
<path d="M975 410 V355" class="line"/>
