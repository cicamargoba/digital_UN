  <line x1="450" y1="60" x2="450" y2="1640" stroke="#7a1f1f" stroke-width="1.8"/>
  <text x="450" y="55" text-anchor="middle" font-size="9" fill="#7a1f1f">addr</text>
  <!-- wdata (green) -->
  <line x1="220" y1="820" x2="470" y2="820" stroke="#2f6b2f" stroke-width="1.8"/>
  <line x1="470" y1="60" x2="470" y2="1640" stroke="#2f6b2f" stroke-width="1.8"/>
  <text x="470" y="55" text-anchor="middle" font-size="9" fill="#2f6b2f">wdata</text>
  <!-- rd (orange) -->
  <line x1="220" y1="870" x2="490" y2="870" stroke="#c06a15" stroke-width="1.8"/>
  <line x1="490" y1="60" x2="490" y2="1640" stroke="#c06a15" stroke-width="1.8"/>
  <text x="490" y="55" text-anchor="middle" font-size="9" fill="#c06a15">rd</text>
  <!-- wr (orange) -->
  <line x1="220" y1="895" x2="510" y2="895" stroke="#c06a15" stroke-width="1.8"/>
  <line x1="510" y1="60" x2="510" y2="1640" stroke="#c06a15" stroke-width="1.8"/>
  <text x="510" y="55" text-anchor="middle" font-size="9" fill="#c06a15">wr</text>

  <!-- ===== ADDRESS DECODER (tapped above the addr bus line, own box) ===== -->
  <rect x="280" y="670" width="110" height="90" fill="#D4E6F1" stroke="#000000" stroke-width="1.5"/>
  <text x="335" y="710" text-anchor="middle" font-size="12" font-weight="bold">Address</text>
  <text x="335" y="727" text-anchor="middle" font-size="12" font-weight="bold">decoder</text>
  <line x1="335" y1="760" x2="335" y2="845" stroke="#7a1f1f" stroke-width="1.5"/>

  <!-- ===== cs0..cs9 individual lines from decoder ===== -->
  <path d="M390,680 L395,680 L395,105 L560,105" fill="none" stroke="#7a1f1f" stroke-width="1.2"/>
  <path d="M390,689 L398,689 L398,265 L560,265" fill="none" stroke="#7a1f1f" stroke-width="1.2"/>
  <path d="M390,698 L401,698 L401,425 L560,425" fill="none" stroke="#7a1f1f" stroke-width="1.2"/>
  <path d="M390,707 L404,707 L404,585 L560,585" fill="none" stroke="#7a1f1f" stroke-width="1.2"/>
  <path d="M390,716 L407,716 L407,745 L560,745" fill="none" stroke="#7a1f1f" stroke-width="1.2"/>
  <path d="M390,725 L410,725 L410,905 L560,905" fill="none" stroke="#7a1f1f" stroke-width="1.2"/>
  <path d="M390,734 L413,734 L413,1065 L560,1065" fill="none" stroke="#7a1f1f" stroke-width="1.2"/>
  <path d="M390,743 L416,743 L416,1225 L560,1225" fill="none" stroke="#7a1f1f" stroke-width="1.2"/>
  <path d="M390,752 L419,752 L419,1385 L560,1385" fill="none" stroke="#7a1f1f" stroke-width="1.2"/>
  <path d="M390,758 L422,758 L422,1545 L560,1545" fill="none" stroke="#7a1f1f" stroke-width="1.2"/>
  <text x="395" y="677" font-size="8" fill="#7a1f1f">cs0</text>
  <text x="398" y="686" font-size="8" fill="#7a1f1f">cs1</text>
  <text x="401" y="695" font-size="8" fill="#7a1f1f">cs2</text>
  <text x="404" y="704" font-size="8" fill="#7a1f1f">cs3</text>
  <text x="407" y="713" font-size="8" fill="#7a1f1f">cs4</text>
  <text x="410" y="722" font-size="8" fill="#7a1f1f">cs5</text>
  <text x="413" y="731" font-size="8" fill="#7a1f1f">cs6</text>
  <text x="416" y="740" font-size="8" fill="#7a1f1f">cs7</text>
  <text x="419" y="749" font-size="8" fill="#7a1f1f">cs8</text>
  <text x="422" y="756" font-size="8" fill="#7a1f1f">cs9</text>

  <!-- ===== PERIPHERAL BLOCKS (single column, 10 rows) — orden = orden del mapa de memoria ===== -->

  <!-- row 0: BRAM -->
