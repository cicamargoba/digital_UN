  <line x1="470" y1="560" x2="560" y2="560" stroke="#2f6b2f" stroke-width="1.5"/>
  <line x1="490" y1="635" x2="560" y2="635" stroke="#c06a15" stroke-width="1.5"/>
  <line x1="510" y1="660" x2="560" y2="660" stroke="#c06a15" stroke-width="1.5"/>
  <line x1="840" y1="610" x2="900" y2="610" stroke="#1a3a6b" stroke-width="1.5"/>

  <!-- row 4: PS2 Keyboard -->
  <rect x="560" y="700" width="280" height="140" fill="#E8DFF5" stroke="#000000" stroke-width="1.5"/>
  <text x="555" y="716" text-anchor="end" font-size="10" font-weight="bold">cs4</text>
  <text x="575" y="720" font-size="11">d_in</text>
  <text x="575" y="745" font-size="11" text-decoration="underline">cs</text>
  <text x="575" y="770" font-size="11">addr</text>
  <text x="575" y="795" font-size="11">rd</text>
  <text x="575" y="820" font-size="11">wr</text>
  <text x="825" y="745" text-anchor="end" font-size="11">d_out</text>
  <text x="700" y="836" text-anchor="middle" font-size="11" font-weight="bold">ps2_keyboard.v</text>
  <line x1="450" y1="770" x2="560" y2="770" stroke="#7a1f1f" stroke-width="1.5"/>
  <line x1="470" y1="720" x2="560" y2="720" stroke="#2f6b2f" stroke-width="1.5"/>
  <line x1="490" y1="795" x2="560" y2="795" stroke="#c06a15" stroke-width="1.5"/>
  <line x1="510" y1="820" x2="560" y2="820" stroke="#c06a15" stroke-width="1.5"/>
  <line x1="840" y1="770" x2="900" y2="770" stroke="#1a3a6b" stroke-width="1.5"/>

