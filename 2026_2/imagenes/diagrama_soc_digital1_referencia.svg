  <line x1="840" y1="930" x2="900" y2="930" stroke="#1a3a6b" stroke-width="1.5"/>

  <!-- row 6: NES Controller -->
  <rect x="560" y="1020" width="280" height="140" fill="#E8DFF5" stroke="#000000" stroke-width="1.5"/>
  <text x="555" y="1036" text-anchor="end" font-size="10" font-weight="bold">cs6</text>
  <text x="575" y="1040" font-size="11">d_in</text>
  <text x="575" y="1065" font-size="11" text-decoration="underline">cs</text>
  <text x="575" y="1090" font-size="11">addr</text>
  <text x="575" y="1115" font-size="11">rd</text>
  <text x="575" y="1140" font-size="11">wr</text>
  <text x="825" y="1065" text-anchor="end" font-size="11">d_out</text>
  <text x="700" y="1156" text-anchor="middle" font-size="11" font-weight="bold">nes_controller.v</text>
  <line x1="450" y1="1090" x2="560" y2="1090" stroke="#7a1f1f" stroke-width="1.5"/>
  <line x1="470" y1="1040" x2="560" y2="1040" stroke="#2f6b2f" stroke-width="1.5"/>
  <line x1="490" y1="1115" x2="560" y2="1115" stroke="#c06a15" stroke-width="1.5"/>
  <line x1="510" y1="1140" x2="560" y2="1140" stroke="#c06a15" stroke-width="1.5"/>
  <line x1="840" y1="1090" x2="900" y2="1090" stroke="#1a3a6b" stroke-width="1.5"/>

  <!-- row 7: I2C -->
  <rect x="560" y="1180" width="280" height="140" fill="#E8DFF5" stroke="#000000" stroke-width="1.5"/>
  <text x="555" y="1196" text-anchor="end" font-size="10" font-weight="bold">cs7</text>
  <text x="575" y="1200" font-size="11">d_in</text>
  <text x="575" y="1225" font-size="11" text-decoration="underline">cs</text>
  <text x="575" y="1250" font-size="11">addr</text>
  <text x="575" y="1275" font-size="11">rd</text>
  <text x="575" y="1300" font-size="11">wr</text>
  <text x="825" y="1225" text-anchor="end" font-size="11">d_out</text>
  <text x="700" y="1316" text-anchor="middle" font-size="11" font-weight="bold">i2c_master.v</text>
  <line x1="450" y1="1250" x2="560" y2="1250" stroke="#7a1f1f" stroke-width="1.5"/>
  <line x1="470" y1="1200" x2="560" y2="1200" stroke="#2f6b2f" stroke-width="1.5"/>
  <line x1="490" y1="1275" x2="560" y2="1275" stroke="#c06a15" stroke-width="1.5"/>
  <line x1="510" y1="1300" x2="560" y2="1300" stroke="#c06a15" stroke-width="1.5"/>
  <line x1="840" y1="1250" x2="900" y2="1250" stroke="#1a3a6b" stroke-width="1.5"/>

  <!-- row 8: I2S -->
  <rect x="560" y="1340" width="280" height="140" fill="#E8DFF5" stroke="#000000" stroke-width="1.5"/>
  <text x="555" y="1356" text-anchor="end" font-size="10" font-weight="bold">cs8</text>
  <text x="575" y="1360" font-size="11">d_in</text>
  <text x="575" y="1385" font-size="11" text-decoration="underline">cs</text>
  <text x="575" y="1410" font-size="11">addr</text>
  <text x="575" y="1435" font-size="11">rd</text>
  <text x="575" y="1460" font-size="11">wr</text>
  <text x="825" y="1385" text-anchor="end" font-size="11">d_out</text>
  <text x="700" y="1476" text-anchor="middle" font-size="11" font-weight="bold">i2s_tx.v</text>
  <line x1="450" y1="1410" x2="560" y2="1410" stroke="#7a1f1f" stroke-width="1.5"/>
  <line x1="470" y1="1360" x2="560" y2="1360" stroke="#2f6b2f" stroke-width="1.5"/>
  <line x1="490" y1="1435" x2="560" y2="1435" stroke="#c06a15" stroke-width="1.5"/>
  <line x1="510" y1="1460" x2="560" y2="1460" stroke="#c06a15" stroke-width="1.5"/>
  <line x1="840" y1="1410" x2="900" y2="1410" stroke="#1a3a6b" stroke-width="1.5"/>

  <!-- row 9: DISPLAY (video memory, ventana grande) -->
  <rect x="560" y="1500" width="280" height="140" fill="#D5F5E3" stroke="#000000" stroke-width="1.5"/>
  <text x="555" y="1516" text-anchor="end" font-size="10" font-weight="bold">cs9</text>
  <text x="575" y="1520" font-size="11">d_in</text>
  <text x="575" y="1545" font-size="11" text-decoration="underline">cs</text>
  <text x="575" y="1570" font-size="11">addr</text>
  <text x="575" y="1595" font-size="11">rd</text>
  <text x="575" y="1620" font-size="11">wr</text>
  <text x="825" y="1545" text-anchor="end" font-size="11">d_out</text>
  <text x="700" y="1636" text-anchor="middle" font-size="11" font-weight="bold">display_driver.v (framebuffer)</text>
  <line x1="450" y1="1570" x2="560" y2="1570" stroke="#7a1f1f" stroke-width="1.5"/>
  <line x1="470" y1="1520" x2="560" y2="1520" stroke="#2f6b2f" stroke-width="1.5"/>
  <line x1="490" y1="1595" x2="560" y2="1595" stroke="#c06a15" stroke-width="1.5"/>
  <line x1="510" y1="1620" x2="560" y2="1620" stroke="#c06a15" stroke-width="1.5"/>
  <line x1="840" y1="1570" x2="900" y2="1570" stroke="#1a3a6b" stroke-width="1.5"/>

  <!-- ===== MUX ===== -->
  <polygon points="900,60 960,110 960,1590 900,1640" fill="#AED6E8" stroke="#000000" stroke-width="1.5"/>
  <text x="930" y="855" text-anchor="middle" font-size="12" font-weight="bold">MUX</text>

  <!-- mux output back to CPU mem_rdata -->
  <path d="M960,850 L1010,850 L1010,15 L5,15 L5,795 L20,795" fill="none" stroke="#1a3a6b" stroke-width="2" marker-end="url(#aB)"/>

  <!-- ===== MEMORY MAP (según especificación del usuario, ventanas de 0x10000 salvo BRAM y DISPLAY) ===== -->
  <g font-size="12">
    <text x="1040" y="135" font-weight="bold">0x000000 - 0x3FFFFF  BRAM</text>
    <text x="1040" y="152" font-size="10">cores/bram/bram.v</text>

    <text x="1040" y="295" font-weight="bold">0x400000 - 0x40FFFF  UART</text>
    <text x="1040" y="312" font-size="10">cores/uart/perip_uart.v</text>

    <text x="1040" y="455" font-weight="bold">0x410000 - 0x41FFFF  SPI-RAM</text>
    <text x="1040" y="472" font-size="10">cores/spiram/perip_spiram.v</text>

    <text x="1040" y="615" font-weight="bold">0x420000 - 0x42FFFF  SPI-FLASH</text>
    <text x="1040" y="632" font-size="10">cores/spi_flash/perip_spiflash.v</text>

    <text x="1040" y="775" font-weight="bold">0x430000 - 0x43FFFF  PS2_KBD</text>
    <text x="1040" y="792" font-size="10">cores/ps2_keyboard/perip_ps2kbd.v</text>

    <text x="1040" y="935" font-weight="bold">0x440000 - 0x44FFFF  PS2_MOUSE</text>
    <text x="1040" y="952" font-size="10">cores/ps2_mouse/perip_ps2mouse.v</text>

    <text x="1040" y="1095" font-weight="bold">0x450000 - 0x45FFFF  NES_CTRL</text>
    <text x="1040" y="1112" font-size="10">cores/nes_ctrl/perip_nes.v</text>

    <text x="1040" y="1255" font-weight="bold">0x460000 - 0x46FFFF  I2C_EEPROM</text>
    <text x="1040" y="1272" font-size="10">cores/i2c/perip_i2c.v</text>

    <text x="1040" y="1415" font-weight="bold">0x470000 - 0x47FFFF  I2S_AUDIO</text>
    <text x="1040" y="1432" font-size="10">cores/i2s/perip_i2s.v</text>

    <text x="1040" y="1575" font-weight="bold">0x480000 - 0x4FFFFF  DISPLAY</text>
    <text x="1040" y="1592" font-size="10">cores/display/perip_display.v (512KB, framebuffer)</text>
  </g>

  <!-- initial block -->
  <text x="1040" y="1660" font-size="12">initial begin</text>
  <text x="1060" y="1678" font-size="12">$readmemh("firmware.hex",MEM);</text>
  <text x="1040" y="1696" font-size="12">end</text>

