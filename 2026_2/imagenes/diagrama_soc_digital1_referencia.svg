  <rect x="560" y="860" width="280" height="140" fill="#E8DFF5" stroke="#000000" stroke-width="1.5"/>
  <text x="555" y="876" text-anchor="end" font-size="10" font-weight="bold">cs5</text>
  <text x="575" y="880" font-size="11">d_in</text>
  <text x="575" y="905" font-size="11" text-decoration="underline">cs</text>
  <text x="575" y="930" font-size="11">addr</text>
  <text x="575" y="955" font-size="11">rd</text>
  <text x="575" y="980" font-size="11">wr</text>
  <text x="825" y="905" text-anchor="end" font-size="11">d_out</text>
  <text x="700" y="996" text-anchor="middle" font-size="11" font-weight="bold">ps2_mouse.v</text>
  <line x1="450" y1="930" x2="560" y2="930" stroke="#7a1f1f" stroke-width="1.5"/>
  <line x1="470" y1="880" x2="560" y2="880" stroke="#2f6b2f" stroke-width="1.5"/>
  <line x1="490" y1="955" x2="560" y2="955" stroke="#c06a15" stroke-width="1.5"/>
