<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1750" viewBox="0 0 1750 1750" font-family="Consolas, Menlo, monospace">
  <rect width="1750" height="1750" fill="#ffffff"/>

  <defs>
    <marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#1a3a6b"/>
    </marker>
  </defs>

  <text x="30" y="30" font-size="16" font-weight="bold">Digital 1 — rtl/SOC.v (CPU caja negra + periféricos CSR)</text>

  <!-- ===== CPU ===== -->
  <rect x="20" y="760" width="200" height="200" fill="#FFF9C4" stroke="#000000" stroke-width="1.5"/>
  <text x="120" y="785" text-anchor="middle" font-size="14" font-weight="bold">RV32I</text>
  <text x="200" y="800" font-size="11" text-anchor="end">mem_rdata[31:0]</text>
  <text x="200" y="825" font-size="11" text-anchor="end">mem_wdata[31:0]</text>
  <text x="200" y="850" font-size="11" text-anchor="end">mem_addr[31:0]</text>
  <text x="200" y="875" font-size="11" text-anchor="end">rd</text>
  <text x="200" y="900" font-size="11" text-anchor="end">wr</text>
  <text x="20" y="945" font-size="11">cores/cpu/femtorv32_quark.v</text>
  <line x1="0" y1="795" x2="20" y2="795" stroke="#1a3a6b" stroke-width="2" marker-end="url(#aB)"/>

