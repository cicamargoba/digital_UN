  <text x="555" y="76" text-anchor="end" font-size="10" font-weight="bold">cs0</text>
  <text x="575" y="80" font-size="11">d_in</text>
  <text x="575" y="105" font-size="11" text-decoration="underline">cs</text>
  <text x="575" y="130" font-size="11">addr</text>
  <text x="575" y="155" font-size="11">rd</text>
  <text x="575" y="180" font-size="11">wr</text>
  <text x="825" y="105" text-anchor="end" font-size="11">d_out</text>
  <text x="700" y="196" text-anchor="middle" font-size="11" font-weight="bold">bram.v</text>
  <line x1="450" y1="130" x2="560" y2="130" stroke="#7a1f1f" stroke-width="1.5"/>
  <line x1="470" y1="80" x2="560" y2="80" stroke="#2f6b2f" stroke-width="1.5"/>
  <line x1="490" y1="155" x2="560" y2="155" stroke="#c06a15" stroke-width="1.5"/>
  <line x1="510" y1="180" x2="560" y2="180" stroke="#c06a15" stroke-width="1.5"/>
  <line x1="840" y1="130" x2="900" y2="130" stroke="#1a3a6b" stroke-width="1.5"/>

  <!-- row 1: UART -->
  <rect x="560" y="220" width="280" height="140" fill="#AED6E8" stroke="#000000" stroke-width="1.5"/>
  <text x="555" y="236" text-anchor="end" font-size="10" font-weight="bold">cs1</text>
  <text x="575" y="240" font-size="11">d_in</text>
  <text x="575" y="265" font-size="11" text-decoration="underline">cs</text>
  <text x="575" y="290" font-size="11">addr</text>
  <text x="575" y="315" font-size="11">rd</text>
  <text x="575" y="340" font-size="11">wr</text>
  <text x="825" y="265" text-anchor="end" font-size="11">d_out</text>
  <text x="700" y="356" text-anchor="middle" font-size="11" font-weight="bold">uart.v</text>
  <line x1="450" y1="290" x2="560" y2="290" stroke="#7a1f1f" stroke-width="1.5"/>
  <line x1="470" y1="240" x2="560" y2="240" stroke="#2f6b2f" stroke-width="1.5"/>
  <line x1="490" y1="315" x2="560" y2="315" stroke="#c06a15" stroke-width="1.5"/>
  <line x1="510" y1="340" x2="560" y2="340" stroke="#c06a15" stroke-width="1.5"/>
  <line x1="840" y1="290" x2="900" y2="290" stroke="#1a3a6b" stroke-width="1.5"/>

  <!-- row 2: SPI-RAM -->
  <rect x="560" y="380" width="280" height="140" fill="#F9E79F" stroke="#000000" stroke-width="1.5"/>
  <text x="555" y="396" text-anchor="end" font-size="10" font-weight="bold">cs2</text>
  <text x="575" y="400" font-size="11">d_in</text>
  <text x="575" y="425" font-size="11" text-decoration="underline">cs</text>
  <text x="575" y="450" font-size="11">addr</text>
  <text x="575" y="475" font-size="11">rd</text>
  <text x="575" y="500" font-size="11">wr</text>
  <text x="825" y="425" text-anchor="end" font-size="11">d_out</text>
  <text x="700" y="516" text-anchor="middle" font-size="11" font-weight="bold">spiram_ctrl.v</text>
  <line x1="450" y1="450" x2="560" y2="450" stroke="#7a1f1f" stroke-width="1.5"/>
  <line x1="470" y1="400" x2="560" y2="400" stroke="#2f6b2f" stroke-width="1.5"/>
  <line x1="490" y1="475" x2="560" y2="475" stroke="#c06a15" stroke-width="1.5"/>
  <line x1="510" y1="500" x2="560" y2="500" stroke="#c06a15" stroke-width="1.5"/>
  <line x1="840" y1="450" x2="900" y2="450" stroke="#1a3a6b" stroke-width="1.5"/>

