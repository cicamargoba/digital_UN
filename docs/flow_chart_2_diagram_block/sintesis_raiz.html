<title>Síntesis de la raíz cuadrada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabecera con escenas → lienzo SVG (hoja de esquemático) → panel de narración y controles → traza de simulación */
:root{
  --paper:#f2f4f7; --sheet:#fbfcfd; --grid:#e4e8ee; --ink:#1b2231; --muted:#5a6477; --line:#2b3346;
  --accent:#2c56c9; --on:#d9381e; --sig:#a8296a; --pill:#ffffff;
  --f-gray:#c9cbcf; --f-pink:#fbbccb; --f-lblue:#acd8e6; --f-lav:#e4e6f8; --f-white:#ffffff; --f-yellow:#fff04a; --f-green:#98ec92;
  --f-reg:#f8898a; --f-sum:#e4e6f8; --f-cnt:#6cb83a; --f-cmpy:#fdf9a8; --f-ctrl:#fbf6c9;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0f141c; --sheet:#141a24; --grid:#1d2533; --ink:#e3e8f1; --muted:#97a3b8; --line:#c5cede;
  --accent:#7ea4ff; --on:#ff6a4d; --sig:#ff86c2; --pill:#141a24;
  --f-gray:#454a54; --f-pink:#74344c; --f-lblue:#22556a; --f-lav:#383b5a; --f-white:#1b2230; --f-yellow:#6a6114; --f-green:#2a672b;
  --f-reg:#843333; --f-sum:#383b5a; --f-cnt:#2f6417; --f-cmpy:#57531f; --f-ctrl:#3d3a1c; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0f141c; --sheet:#141a24; --grid:#1d2533; --ink:#e3e8f1; --muted:#97a3b8; --line:#c5cede;
  --accent:#7ea4ff; --on:#ff6a4d; --sig:#ff86c2; --pill:#141a24;
  --f-gray:#454a54; --f-pink:#74344c; --f-lblue:#22556a; --f-lav:#383b5a; --f-white:#1b2230; --f-yellow:#6a6114; --f-green:#2a672b;
  --f-reg:#843333; --f-sum:#383b5a; --f-cnt:#2f6417; --f-cmpy:#57531f; --f-ctrl:#3d3a1c; color-scheme:dark }

body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--cond);font-weight:700;font-size:clamp(24px,3.2vw,34px);margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-family:var(--mono);font-size:12.5px}
.scenes{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.scenes button{font:500 12.5px var(--mono);color:var(--muted);background:transparent;border:1px solid var(--grid);border-radius:4px;padding:5px 9px;cursor:pointer}
.scenes button[aria-current="true"]{color:var(--sheet);background:var(--ink);border-color:var(--ink)}
.scenes button:focus-visible,.ctl button:focus-visible,.sim input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stagewrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--grid);border-radius:6px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
#stage{display:block;width:100%;min-width:820px;height:auto}
.panel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 28px;align-items:start}
@media (max-width:760px){.panel{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0}
.panel h2{font-family:var(--cond);font-weight:700;font-size:22px;margin:2px 0 6px;text-wrap:balance}
.panel p{margin:0;max-width:68ch}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl button{font:600 14px var(--sans);border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:4px;padding:8px 14px;cursor:pointer;min-height:40px}
.ctl button.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.ctl button:disabled{opacity:.4;cursor:default}
.count{font:12.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;width:100%}
[hidden]{display:none!important}
.sim{display:grid;gap:10px;border-top:1px solid var(--grid);padding-top:14px}
.sim .row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.sim label{font:500 13px var(--mono)}
.sim input{width:64px;font:15px var(--mono);padding:5px 6px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);color:var(--ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;font:13px var(--mono);font-variant-numeric:tabular-nums;min-width:640px;width:100%}
th,td{text-align:left;padding:4px 10px;border-bottom:1px solid var(--grid);white-space:nowrap}
th{color:var(--muted);font-weight:600}
tr.cur td{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.hint{font:12.5px var(--mono);color:var(--muted)}

svg text{font-family:var(--sans);font-size:14px;fill:var(--ink)}
svg .b{font-weight:600}
svg .mono{font-family:var(--mono)}
svg .sm{font-size:11.5px}
svg .lbl{font-family:var(--mono);font-size:11.5px;fill:var(--muted)}
svg .sig{fill:var(--sig);font-family:var(--mono);font-size:12px}
svg .ttl{font-family:var(--cond);font-weight:700;font-size:15px}
svg .port{font-family:var(--mono);font-size:11px;fill:var(--ink)}
svg .ann{font-family:var(--mono);font-size:11.5px;fill:var(--on);font-weight:600}
svg .one{fill:var(--on);font-weight:600}
.w,.t{fill:none;stroke:var(--line);stroke-width:1.6}
.bus{fill:none;stroke:var(--line);stroke-width:3}
.shape{stroke:var(--line);stroke-width:2}
.f-gray{fill:var(--f-gray)} .f-pink{fill:var(--f-pink)} .f-lblue{fill:var(--f-lblue)} .f-lav{fill:var(--f-lav)}
.f-white{fill:var(--f-white)} .f-yellow{fill:var(--f-yellow)} .f-green{fill:var(--f-green)} .f-reg{fill:var(--f-reg)}
.f-sum{fill:var(--f-sum)} .f-cnt{fill:var(--f-cnt)} .f-cmpy{fill:var(--f-cmpy)} .f-ctrl{fill:var(--f-ctrl)}
.ahp{fill:var(--line)} .ahm{fill:var(--accent)}
.map{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.pill rect{fill:var(--pill);stroke:var(--on);stroke-width:1.4}
.pill text{font-family:var(--mono);font-size:11.5px;fill:var(--on);font-weight:600}
.pill .opx{fill:var(--ink);font-weight:400}
.pill.in rect{stroke:var(--sig)} .pill.in text{fill:var(--sig)}
.pill.none rect{stroke:var(--muted);stroke-dasharray:3 3} .pill.none text{fill:var(--muted)}
.el{opacity:0;transition:opacity .55s ease;pointer-events:none}
.el.on{opacity:1}
.hl .shape{stroke:var(--accent);stroke-width:4}
text.hl{fill:var(--accent)!important;font-weight:700}
.tr.hl path{stroke:var(--accent);stroke-width:3}
.tr.hl text{fill:var(--accent);font-weight:700}
text.act{fill:var(--on)!important;font-weight:700}
.state.active .shape{stroke:var(--on);stroke-width:5}
#fsm{transition:transform 1s cubic-bezier(.6,0,.2,1),opacity .55s ease}
#fsm.collapsed{transform:translate(-160px,132px) scale(.49)}
@media (prefers-reduced-motion:reduce){ .el,#fsm{transition:none} .map{animation:none} }

:root{--q-sqr:#f3f4f6;--q-init:#fff6c8;--q-sh:#b9e3fb;--q-tmp:#dde5e5;--q-chk:#ffffff;--q-a2:#c9ecc0;--q-z:#f7c9c3;--q-end:#d9cbf3;--q-start:#f6ec6e;--q-r:#ffffff;--q-sum:#d9ebd2;--q-cnt:#fcdcd8;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--q-sqr:#262c37;--q-init:#575024;--q-sh:#244f6c;--q-tmp:#37414a;--q-chk:#1b2230;--q-a2:#2b5b2a;--q-z:#6a3434;--q-end:#4b3a6c;--q-start:#6a6320;--q-r:#1b2230;--q-sum:#2e4a2c;--q-cnt:#6a3a3a;} }
:root[data-theme="dark"]{--q-sqr:#262c37;--q-init:#575024;--q-sh:#244f6c;--q-tmp:#37414a;--q-chk:#1b2230;--q-a2:#2b5b2a;--q-z:#6a3434;--q-end:#4b3a6c;--q-start:#6a6320;--q-r:#1b2230;--q-sum:#2e4a2c;--q-cnt:#6a3a3a;}
.q-sqr{fill:var(--q-sqr)} .q-init{fill:var(--q-init)} .q-sh{fill:var(--q-sh)} .q-tmp{fill:var(--q-tmp)} .q-chk{fill:var(--q-chk)}
.q-a2{fill:var(--q-a2)} .q-z{fill:var(--q-z)} .q-end{fill:var(--q-end)} .q-start{fill:var(--q-start)} .q-r{fill:var(--q-r)}
.q-sum{fill:var(--q-sum)} .q-cnt{fill:var(--q-cnt)}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Síntesis de la raíz cuadrada</h1>
      <p class="sub">diagrama de flujo → ruta de datos → FSM → diagrama de bloques</p>
    </div>
    <ul class="scenes" id="scenes"></ul>
  </header>
  <div class="stagewrap">
  <svg id="stage" viewBox="0 0 1200 700" role="img" aria-label="Animación de síntesis de la raíz cuadrada">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="ahp" d="M0,0 L10,5 L0,10z"/></marker>
      <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="ahm" d="M0,0 L10,5 L0,10z"/></marker>
    </defs>

    <!-- ===== Diagrama de flujo ===== -->
    <g id="fc" class="el on">
      <path class="w" d="M250,44 V56" marker-end="url(#ah)"/>
      <path class="w" d="M330,82 H360 V52 H254" marker-end="url(#ah)"/><text x="336" y="74" class="sm">NO</text>
      <path class="w" d="M500,568 H575 V52 H360"/>
      <path class="w" d="M250,106 V116" marker-end="url(#ah)"/><text x="258" y="116" class="sm">YES</text>
      <path class="w" d="M250,198 V220" marker-end="url(#ah)"/>
      <path class="w" d="M250,288 V298" marker-end="url(#ah)"/>
      <path class="w" d="M250,332 V345" marker-end="url(#ah)"/>
      <path class="w" d="M140,385 H126 V450" marker-end="url(#ah)"/><text x="110" y="377" class="sm">NO</text>
      <path class="w" d="M360,385 H400 V450" marker-end="url(#ah)"/><text x="366" y="377" class="sm">YES</text>
      <path class="w" d="M126,500 V522 H250"/>
      <path class="w" d="M400,488 V522 H250"/>
      <path class="w" d="M250,522 V532" marker-end="url(#ah)"/>
      <path class="w" d="M360,568 H388" marker-end="url(#ah)"/><text x="362" y="560" class="sm">YES</text>
      <path class="w" d="M140,568 H18 V210 H246" marker-end="url(#ah)"/><text x="104" y="560" class="sm">NO</text>

      <g id="fc-sqr"><rect class="shape q-sqr" x="160" y="8" width="180" height="36" rx="18"/>
        <text x="250" y="31" text-anchor="middle" class="mono">SQR(op_A)</text></g>
      <g id="fc-init"><polygon class="shape q-chk" points="170,82 250,58 330,82 250,106"/>
        <text x="250" y="87" text-anchor="middle" class="mono">init == 1?</text></g>
      <g id="fc-ini"><rect class="shape q-init" x="140" y="118" width="220" height="80"/>
        <text x="250" y="136" text-anchor="middle" class="mono sm">done = 0, result = 0</text>
        <text x="250" y="153" text-anchor="middle" class="mono sm">count = N/2, tmp = 0</text>
        <text x="250" y="170" text-anchor="middle" class="mono sm">A = {A″, op_A}</text>
        <text x="250" y="187" text-anchor="middle" class="mono sm">R = 0, R[0] = 0</text></g>
      <g id="fc-sh"><rect class="shape q-sh" x="140" y="222" width="220" height="66"/>
        <text x="250" y="242" text-anchor="middle" class="mono sm">A = A &lt;&lt; 2</text>
        <text x="250" y="260" text-anchor="middle" class="mono sm">R = R &lt;&lt; 1</text>
        <text x="250" y="278" text-anchor="middle" class="mono sm">count --</text></g>
      <g id="fc-tmp"><rect class="shape q-tmp" x="140" y="300" width="220" height="32"/>
        <text x="250" y="321" text-anchor="middle" class="mono">tmp = R</text></g>
      <g id="fc-cmp"><polygon class="shape q-chk" points="140,385 250,347 360,385 250,423"/>
        <text x="250" y="381" text-anchor="middle" class="mono sm">A″ &lt; (tmp&lt;&lt;1)+1</text>
        <text x="250" y="397" text-anchor="middle" class="mono sm">?</text></g>
      <g id="fc-a2"><rect class="shape q-a2" x="36" y="452" width="180" height="48"/>
        <text x="126" y="471" text-anchor="middle" class="mono sm">R[0] = 1</text>
        <text x="126" y="489" text-anchor="middle" class="mono sm">A″ = A″ − ((tmp&lt;&lt;1)+1)</text></g>
      <g id="fc-r0"><rect class="shape q-chk" x="330" y="452" width="140" height="36"/>
        <text x="400" y="475" text-anchor="middle" class="mono">R[0] = 0</text></g>
      <g id="fc-z"><polygon class="shape q-z" points="140,568 250,534 360,568 250,602"/>
        <text x="250" y="573" text-anchor="middle" class="mono">count == 0?</text></g>
      <g id="fc-done"><rect class="shape q-end" x="390" y="550" width="110" height="36" rx="4"/>
        <text x="445" y="573" text-anchor="middle" class="mono">done = 1</text></g>
    </g>

    <!-- Señales de control -->
    <g id="co-ini" class="el pill"><rect x="368" y="112" width="198" height="84" rx="4"/>
      <text x="376" y="129"><tspan class="opx">R=0</tspan> → RST</text>
      <text x="376" y="147"><tspan class="opx">tmp=0</tspan> → RST</text>
      <text x="376" y="165"><tspan class="opx">A={A″,op_A}</tspan> → LDA/RSTA</text>
      <text x="376" y="183"><tspan class="opx">count=N/2</tspan> → LD</text></g>
    <g id="co-sh" class="el pill"><rect x="368" y="226" width="128" height="58" rx="4"/>
      <text x="376" y="243"><tspan class="opx">A&lt;&lt;2</tspan> → SH</text>
      <text x="376" y="260"><tspan class="opx">R&lt;&lt;1</tspan> → SH</text>
      <text x="376" y="277"><tspan class="opx">count--</tspan> → SH</text></g>
    <g id="co-tmp" class="el pill"><rect x="368" y="304" width="118" height="24" rx="4"/>
      <text x="376" y="320"><tspan class="opx">tmp=R</tspan> → LD</text></g>
    <g id="co-a2" class="el pill"><rect x="222" y="446" width="104" height="44" rx="4"/>
      <text x="230" y="463"><tspan class="opx">R[0]=1</tspan> → R0</text>
      <text x="230" y="481"><tspan class="opx">A″−…</tspan> → LDA2</text></g>
    <g id="co-r0" class="el pill none"><rect x="476" y="458" width="92" height="24" rx="4"/>
      <text x="484" y="474">sin señal</text></g>
    <g id="co-done" class="el pill"><rect x="410" y="498" width="78" height="22" rx="4"/>
      <text x="418" y="513">→ DONE</text></g>
    <g id="co-init" class="el pill in"><rect x="84" y="71" width="78" height="22" rx="4"/>
      <text x="92" y="86">lee INIT</text></g>
    <g id="co-msb" class="el pill in"><rect x="26" y="330" width="70" height="22" rx="4"/>
      <text x="34" y="345">lee MSB</text></g>
    <g id="co-z" class="el pill in"><rect x="30" y="592" width="58" height="22" rx="4"/>
      <text x="38" y="607">lee Z</text></g>

    <!-- ===== Bloque de control ===== -->
    <g id="ctrl" class="el">
      <rect class="shape f-ctrl" x="110" y="100" width="340" height="380" rx="4"/>
      <text x="126" y="124" class="ttl">Control</text>
      <path class="bus" d="M62,170 H106" marker-end="url(#ah)"/><text id="i-init" x="56" y="175" text-anchor="end" class="mono b">INIT</text>
      <path class="w" d="M62,330 H106" marker-end="url(#ah)"/><text id="i-msb" x="56" y="334" text-anchor="end" class="sig">MSB</text>
      <path class="w" d="M62,370 H106" marker-end="url(#ah)"/><text id="i-z" x="56" y="374" text-anchor="end" class="sig">Z</text>
      <path class="w" d="M450,140 H490" marker-end="url(#ah)"/><text id="o-lda2" x="496" y="144" class="lbl">LDA2</text>
      <path class="w" d="M450,180 H490" marker-end="url(#ah)"/><text id="o-ld" x="496" y="184" class="lbl">LD</text>
      <path class="w" d="M450,220 H490" marker-end="url(#ah)"/><text id="o-sh" x="496" y="224" class="lbl">SH</text>
      <path class="w" d="M450,260 H490" marker-end="url(#ah)"/><text id="o-r0" x="496" y="264" class="lbl">R0</text>
      <path class="w" d="M450,300 H490" marker-end="url(#ah)"/><text id="o-ldtmp" x="496" y="304" class="lbl">LD_TMP</text>
      <path class="bus" d="M280,480 V516" marker-end="url(#ah)"/><text id="o-done" x="280" y="536" text-anchor="middle" class="mono b">DONE</text>
    </g>

    <g id="fsm" class="el">
      <g id="fs-start" class="el">
        <g id="t-i0" class="tr"><path class="t" d="M665,58 C645,5 735,5 715,58" marker-end="url(#ah)"/><text x="640" y="26" text-anchor="end" class="mono sm">INIT=0</text></g>
        <g id="t-i1" class="tr"><path class="t" d="M690,166 V272" marker-end="url(#ah)"/><text x="700" y="224" text-anchor="start" class="mono sm">INIT=1</text></g>
        <g id="st-START" class="state"><ellipse class="shape q-start" cx="690" cy="110" rx="92" ry="56"/>
          <text x="690" y="88" text-anchor="middle" class="b">START</text>
          <text x="690" y="107" text-anchor="middle" class="mono sm"><tspan>done=0</tspan> <tspan>ld_tmp=0</tspan></text>
          <text x="690" y="123" text-anchor="middle" class="mono sm"><tspan>r0=0</tspan> <tspan>sh=0</tspan></text>
          <text x="690" y="139" text-anchor="middle" class="mono sm"><tspan class="one">ld=1</tspan> <tspan>lda2=0</tspan></text></g>
      </g>
      <g id="fs-sd" class="el">
        <g id="t-sd" class="tr"><path class="t" d="M752,288 L850,160" marker-end="url(#ah)"/></g>
        <g id="st-SHIFT_DEC" class="state"><ellipse class="shape q-sh" cx="690" cy="330" rx="92" ry="56"/>
          <text x="690" y="308" text-anchor="middle" class="b">SHIFT_DEC</text>
          <text x="690" y="327" text-anchor="middle" class="mono sm"><tspan>done=0</tspan> <tspan>ld_tmp=0</tspan></text>
          <text x="690" y="343" text-anchor="middle" class="mono sm"><tspan>r0=0</tspan> <tspan class="one">sh=1</tspan></text>
          <text x="690" y="359" text-anchor="middle" class="mono sm"><tspan>ld=0</tspan> <tspan>lda2=0</tspan></text></g>
      </g>
      <g id="fs-tmp" class="el">
        <g id="t-tmp" class="tr"><path class="t" d="M980,142 L1022,170" marker-end="url(#ah)"/></g>
        <g id="st-LOAD_TMP" class="state"><ellipse class="shape q-tmp" cx="900" cy="110" rx="92" ry="56"/>
          <text x="900" y="88" text-anchor="middle" class="b">LOAD_TMP</text>
          <text x="900" y="107" text-anchor="middle" class="mono sm"><tspan>done=0</tspan> <tspan class="one">ld_tmp=1</tspan></text>
          <text x="900" y="123" text-anchor="middle" class="mono sm"><tspan>r0=0</tspan> <tspan>sh=0</tspan></text>
          <text x="900" y="139" text-anchor="middle" class="mono sm"><tspan>ld=0</tspan> <tspan>lda2=0</tspan></text></g>
      </g>
      <g id="fs-check" class="el">
        <g id="t-m1" class="tr"><path class="t" d="M1040,268 L932,410" marker-end="url(#ah)"/><text x="996" y="352" text-anchor="start" class="mono sm">MSB=1</text></g>
        <g id="t-m0" class="tr"><path class="t" d="M1090,276 V402" marker-end="url(#ah)"/><text x="1100" y="342" text-anchor="start" class="mono sm">MSB=0</text></g>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const ALL_EL = Array.from(document.querySelectorAll('.el')).map(e => e.id).filter(Boolean);
  const SCENES = ['Algoritmo','Ruta de datos','Interconexión','Control','Síntesis','Ejecución'];
  const DP = ['dp-reg','dp-r','dp-tmp','dp-sum','dp-msb','dp-cnt','dp-wires'];
  const CO = ['co-ini','co-sh','co-tmp','co-a2','co-r0','co-done','co-init','co-msb','co-z'];
  const N = 8, H = N/2;

  const base = [
    {sc:1, t:'El algoritmo', d:'Raíz cuadrada dígito a dígito. En cada iteración entran a A″ los dos bits más significativos de op_A y R se corre una posición. Si A″ ≥ 2·R+1, se resta ese valor de A″ y el nuevo bit de R vale 1; si no, vale 0. Tras N/2 iteraciones, R es la raíz y A″ el residuo.',
      add:['fc'], hl:[]},
    {sc:2, t:'A = A << 2 → registro de corrimiento doble', d:'A″ y LSR(2) forman un solo registro que se corre dos posiciones: los dos bits más significativos de op_A pasan a A″. Sus entradas de control se deciden después, al revisar todo lo que se hace con A″.',
      add:['dp-reg'], tmp:['m-sh'], hl:['fc-sh','dp-reg']},
    {sc:2, t:'R = R << 1 → registro R', d:'R es un registro de corrimiento a la izquierda de una posición.',
      add:['dp-r'], tmp:['m-sh'], hl:['fc-sh','dp-r']},
    {sc:2, t:'count-- → contador', d:'El número de iteraciones (N/2) se lleva con un contador descendente, cuya salida Z indica count = 0.',
      add:['dp-cnt'], tmp:['m-sh'], hl:['fc-sh','fc-z','dp-cnt']},
    {sc:2, t:'tmp = R → registro tmp', d:'tmp guarda una copia de R para formar el valor de prueba (tmp<<1)+1.',
      add:['dp-tmp'], tmp:['m-tmp'], hl:['fc-tmp','dp-tmp']},
    {sc:2, t:'A″ < (tmp<<1)+1 ? → restador', d:'(tmp<<1)+1 no necesita hardware: es la concatenación {tmp,1}. La comparación se hace restando A″ − {tmp,1} en SUM_C2; si el resultado es negativo, su MSB vale 1. El mismo resultado sirve para A″ = A″ − ((tmp<<1)+1).',
      add:['dp-sum','dp-msb'], tmp:['m-cmp'], hl:['fc-cmp','fc-a2','dp-sum','dp-msb']},
    {sc:2, t:'¿Qué se hace con A″?', d:'A = {A″,op_A} en la inicialización requiere LDA/RSTA (A″ ← 0, LSR ← op_A). A = A << 2 requiere SH. A″ = A″ − ((tmp<<1)+1) requiere LDA2, que carga en A″ el resultado de SUM_C2.',
      add:['p-ldrst','p-sh','p-lda2','a-ld1','a-sh1','a-lda2'], hl:['fc-ini','fc-sh','fc-a2','p-ldrst','p-sh','p-lda2']},
    {sc:2, t:'¿Qué se hace con R?', d:'R = 0 requiere RST. R = R << 1 requiere SH. R[0] = 1 requiere una carga individual del bit 0 (load_R0) con su dato (R0). R[0] = 0 no requiere entrada: el corrimiento ya dejó un 0.',
      add:['p-rrst','p-rsh','p-lr0','p-r0','a-rrst','a-rsh','a-lr0'], hl:['fc-ini','fc-sh','fc-a2','fc-r0','p-rrst','p-rsh','p-lr0','p-r0']},
    {sc:2, t:'¿Qué se hace con tmp?', d:'tmp = 0 requiere RST y tmp = R requiere LD.',
      add:['p-trst','p-tld','a-trst','a-tld'], hl:['fc-ini','fc-tmp','p-trst','p-tld']},
    {sc:2, t:'¿Qué se hace con count?', d:'count = N/2 requiere LD y count-- requiere DEC.',
      add:['p-cld','p-cdec','a-cld','a-cdec'], hl:['fc-ini','fc-sh','p-cld','p-cdec']},
    {sc:3, t:'Interconexión del camino de datos', d:'A″ alimenta SUM_C2 (w_lda_out) junto con {tmp,1}. El resultado regresa a A″ (w_lda2_in) y su MSB va al control. R alimenta tmp y es la salida Result. El contador genera Z. Las entradas de control quedan como señales con nombre: LDA2, LD, SH, R0 y LD_TMP.',
      add:['dp-wires'], hl:[]},
    {sc:4, t:'Inicialización → LD', d:'Variable = 0 se traduce en RESET y variable = valor externo en LOAD. R=0 y tmp=0 activan RST, A = {A″,op_A} activa LDA/RSTA y count = N/2 activa la carga del contador. Todas ocurren en el mismo paso, así que comparten una señal: LD.',
      add:['co-ini','a-ld1','a-rrst','a-trst','a-cld'], hl:['fc-ini','n-ld1','n-ld2','n-ld3','n-ld4','p-ldrst','p-rrst','p-trst','p-cld']},
    {sc:4, t:'Corrimientos y decremento → SH', d:'Variable = operación se traduce en la señal de esa operación. A<<2, R<<1 y count-- ocurren en el mismo paso, así que una sola señal SH llega al SH del registro A″/LSR, al SH de R y al DEC del contador.',
      add:['co-sh','a-sh1','a-rsh','a-cdec'], hl:['fc-sh','n-sh1','n-sh2','n-sh3','p-sh','p-rsh','p-cdec']},
    {sc:4, t:'tmp = R → LD_TMP', d:'La copia de R en tmp activa la carga de tmp mediante LD_TMP.',
      add:['co-tmp','a-tld'], hl:['fc-tmp','n-ldtmp','p-tld']},
    {sc:4, t:'R[0] = 1 y la resta → LDA2 y R0', d:'A″ = A″ − ((tmp<<1)+1) activa la carga de A″ mediante LDA2. La misma señal LDA2 habilita load_R0 en R, y R0 = 1 es el dato que se escribe en R[0]. Ambas operaciones ocurren en el mismo paso.',
      add:['co-a2','a-lda2','a-lr0'], hl:['fc-a2','n-lda2','n-lda2b','n-r0','p-lda2','p-lr0','p-r0']},
    {sc:4, t:'R[0] = 0 → ninguna señal', d:'R[0] = 0 no genera señal: después del corrimiento, R[0] ya vale 0, así que basta con no activar load_R0.',
      add:['co-r0'], hl:['fc-r0']},
    {sc:4, t:'done = 1 → DONE', d:'DONE no actúa sobre el camino de datos. Es una salida que avisa que Result contiene la raíz.',
      add:['co-done'], hl:['fc-done']},
    {sc:4, t:'Decisiones → entradas del control', d:'Las decisiones consultan señales. init == 1? lee la entrada externa INIT. A″ < (tmp<<1)+1 ? lee el MSB de SUM_C2, y count == 0? lee la salida Z del contador.',
      add:['co-init','co-msb','co-z'], hl:['fc-init','fc-cmp','fc-z','n-msb','n-z']},
    {sc:4, t:'Inicialización e init == 1? → START', d:'Cada bloque de acción se convierte en un estado, y sus asignaciones se convierten en las salidas del estado. El bloque inicial es START, con ld=1. init == 1? no crea estado: INIT=0 lo mantiene en START e INIT=1 lo lleva a SHIFT_DEC.',
      add:['fsm','fs-start'], rm:DP.concat(CO), tmp:['c-start'], hl:['fc-ini','fc-init','st-START','t-i0','t-i1']},
    {sc:4, t:'Corrimientos → SHIFT_DEC', d:'A<<2, R<<1 y count-- forman el estado SHIFT_DEC, con sh=1. Pasa sin condición a LOAD_TMP.',
      add:['fs-sd'], tmp:['c-sd'], hl:['fc-sh','st-SHIFT_DEC','t-sd']},
    {sc:4, t:'tmp = R → LOAD_TMP', d:'tmp = R es el estado LOAD_TMP, con ld_tmp=1. Pasa sin condición a CHECK.',
      add:['fs-tmp'], tmp:['c-tmp'], hl:['fc-tmp','st-LOAD_TMP','t-tmp']},
    {sc:4, t:'A″ < (tmp<<1)+1 ? → CHECK', d:'La comparación se evalúa en el estado CHECK, sin salidas activas. La rama NO (MSB=0) va a LOAD_A2. La rama YES lleva a R[0] = 0, que no tiene salidas, así que pasa directo a CHECK_Z con MSB=1.',
      add:['fs-check'], tmp:['c-check'], hl:['fc-cmp','fc-r0','st-CHECK','t-m0','t-m1']},
    {sc:4, t:'R[0] = 1 y la resta → LOAD_A2', d:'Las dos asignaciones del bloque forman el estado LOAD_A2, con lda2=1 y r0=1. Después pasa a CHECK_Z.',
      add:['fs-a2'], tmp:['c-a2'], hl:['fc-a2','st-LOAD_A2','t-a2']},
    {sc:4, t:'count == 0? → CHECK_Z', d:'En este diseño, la decisión count == 0? tiene su propio estado, CHECK_Z, donde se unen las dos ramas. Z=0 vuelve a SHIFT_DEC y Z=1 va a END1. En el divisor, en cambio, esta decisión se incorporó a las transiciones; ambas formas son válidas.',
      add:['fs-cz'], tmp:['c-cz'], hl:['fc-z','st-CHECK_Z','t-z0','t-z1']},
    {sc:4, t:'done = 1 → END1', d:'done = 1 es el estado END1, con done=1. De ahí regresa a START para esperar una nueva orden INIT.',
      add:['fs-end1'], tmp:['c-end'], hl:['fc-done','st-END1','t-end']},
    {sc:4, t:'Flujo y máquina de control', d:'Cada estado conserva el color de su bloque en el flujo. Cada bloque de acción es un estado. Las decisiones A″ < (tmp<<1)+1 ? y count == 0? tienen estado propio (CHECK y CHECK_Z); init == 1? se convierte en transiciones.',
      add:[], hl:[]},
    {sc:5, t:'FSM → bloque Control', d:'La FSM se encapsula en el bloque Control. Sus salidas LDA2, LD, SH, R0, LD_TMP y DONE manejan el camino de datos. Sus entradas son INIT y las señales MSB y Z.',
      add:['ctrl'].concat(DP), rm:['fc'], hl:[], collapse:true},
    {sc:6, t:'Ejecución ciclo a ciclo', d:'Simulación de la raíz cuadrada de op_A (N = 8) en el hardware sintetizado. En cada ciclo se resaltan el estado activo, las señales en 1 y el contenido de los registros. Cambie op_A en el panel inferior.',
      add:[], hl:[], collapse:true}
  ];

  let vis = new Set();
  base.forEach(s => { (s.rm||[]).forEach(x => vis.delete(x)); (s.add||[]).forEach(x => vis.add(x)); s.vis = new Set([...vis, ...(s.tmp||[])]); });
  const FINAL_VIS = base[base.length-1].vis;
  const hlIds = [...new Set(base.flatMap(s => s.hl))];

  const bn = (v,n) => v.toString(2).padStart(n,'0');
  function trace(op){
    let st='START', A=null, L=null, R=null, T=null, C=null; const rows=[];
    for(let c=0;c<80;c++){
      const diff = A===null?null:A-(2*T+1), msb = diff===null?null:(diff<0?1:0), z = C===null?null:(C===0?1:0);
      const r = {c,st,A,L,R,T,C,diff,msb,z,LD:st==='START',SH:st==='SHIFT_DEC',LD_TMP:st==='LOAD_TMP',LDA2:st==='LOAD_A2',R0:st==='LOAD_A2',DONE:st==='END1'};
      let ns;
      if(st==='START'){ r.msg='LD=1: en el flanco A″ = 0, LSR carga op_A = '+op+', R = 0, tmp = 0 y count = N/2 = '+H+'. Con INIT=1 pasa a SHIFT_DEC.'; A=0; L=op; R=0; T=0; C=H; ns='SHIFT_DEC'; }
      else if(st==='SHIFT_DEC'){ const nA=(A<<2)|(L>>(N-2)), nL=(L<<2)&((1<<N)-1), nR=(R<<1)&((1<<H)-1);
        r.msg='SH=1: en el flanco {A″,LSR} se corre dos posiciones: A″ = '+A+' → '+nA+'. R = '+R+' → '+nR+' y count = '+C+' → '+(C-1)+'.'; A=nA; L=nL; R=nR; C=C-1; ns='LOAD_TMP'; }
      else if(st==='LOAD_TMP'){ r.msg='LD_TMP=1: en el flanco tmp = R = '+R+'.'; T=R; ns='CHECK'; }
      else if(st==='CHECK'){ ns = msb===0?'LOAD_A2':'CHECK_Z';
        r.msg='A″ − {tmp,1} = '+A+' − '+(2*T+1)+' = '+diff+' → MSB='+msb+'. '+(msb===0?'A″ ≥ (tmp<<1)+1: va a LOAD_A2.':'A″ < (tmp<<1)+1: R[0] queda en 0 y pasa a CHECK_Z.'); }
      else if(st==='LOAD_A2'){ r.msg='LDA2=1 y R0=1: en el flanco A″ = '+diff+' y R[0] = 1 (R = '+(R|1)+').'; A=diff; R=R|1; ns='CHECK_Z'; }
      else if(st==='CHECK_Z'){ ns = z?'END1':'SHIFT_DEC'; r.msg='Z='+z+' (count = '+C+') → '+ns+'.'; }
      else { r.msg='done=1. Result = R = '+R+', residuo A″ = '+A+'. Comprobación: '+op+' = '+R+'² + '+A+'.'; rows.push(r); break; }
      rows.push(r); st=ns;
    }
    return rows;
  }

  let rows=[], steps=[], idx=0, timer=null;
  function build(){
    let v=parseInt($('inA').value,10); if(isNaN(v)) v=0; v=Math.max(0,Math.min(255,v)); $('inA').value=v;
    rows = trace(v);
    steps = base.concat(rows.map((r,i) => ({sc:6, sim:r, i, collapse:true, vis:FINAL_VIS, hl:[], t:'Ciclo '+r.c+' · '+r.st, d:r.msg})));
  }
  const SIG = {
    LD:['o-ld','n-ld1','n-ld2','n-ld3','n-ld4','p-ldrst','p-rrst','p-trst','p-cld','i-init'],
    SH:['o-sh','n-sh1','n-sh2','n-sh3','p-sh','p-rsh','p-cdec'],
    LD_TMP:['o-ldtmp','n-ldtmp','p-tld'], LDA2:['o-lda2','n-lda2','n-lda2b','p-lda2','p-lr0'],
    R0:['o-r0','n-r0','p-r0'], DONE:['o-done'], msb:['i-msb','n-msb'], z:['i-z','n-z']
  };
  const sigIds = [...new Set(Object.values(SIG).flat())];
  const STATES = ['START','SHIFT_DEC','LOAD_TMP','CHECK','LOAD_A2','CHECK_Z','END1'];

  function render(){
    const s = steps[idx];
    ALL_EL.forEach(id => $(id).classList.toggle('on', s.vis.has(id)));
    const hl = new Set(s.hl||[]);
    hlIds.forEach(id => $(id).classList.toggle('hl', hl.has(id)));
    $('fsm').classList.toggle('collapsed', !!s.collapse);
    const r = s.sim;
    STATES.forEach(n => $('st-'+n).classList.toggle('active', !!r && r.st===n));
    const act = new Set();
    if(r) Object.keys(SIG).forEach(k => { if(r[k]) SIG[k].forEach(x => act.add(x)); });
    sigIds.forEach(id => $(id).classList.toggle('act', act.has(id)));
    const d='—', f = (v,n) => v===null?d:bn(v,n)+' ('+v+')';
    $('v-a').textContent = r ? '= '+f(r.A,H+2) : '';
    $('v-l').textContent = r ? (r.L===null?d:bn(r.L,N)) : '';
    $('v-r').textContent = r ? '= '+f(r.R,H) : '';
    $('v-t').textContent = r ? '= '+f(r.T,H) : '';
    $('v-sum').textContent = r ? (r.diff===null?d:r.diff+' · MSB='+r.msb) : '';
    $('v-cnt').textContent = r ? '= '+(r.C===null?d:r.C) : '';

    $('eyebrow').textContent = 'Escena '+s.sc+' · '+SCENES[s.sc-1];
    $('stitle').textContent = s.t; $('stext').textContent = s.d;
    $('count').textContent = 'Paso '+(idx+1)+' de '+steps.length;
    $('bprev').disabled = idx===0; $('bnext').disabled = idx===steps.length-1;
    document.querySelectorAll('#scenes button').forEach((bt,i) => bt.setAttribute('aria-current', String(i+1===s.sc)));
    const simOn = s.sc===6; $('simpanel').hidden = !simOn;
    if(simOn){
      const upto = r ? s.i : -1, g = v => v===null?d:v;
      $('trace').innerHTML = rows.slice(0,upto+1).map((x,i) => {
        const outs = ['LD','SH','LD_TMP','LDA2','R0','DONE'].filter(k => x[k]).join(', ') || d;
        return '<tr'+(i===upto?' class="cur"':'')+'><td>'+x.c+'</td><td>'+x.st+'</td><td>'+f(x.A,H+2)+'</td><td>'+(x.L===null?d:bn(x.L,N))+'</td><td>'+f(x.R,H)+'</td><td>'+f(x.T,H)+'</td><td>'+g(x.C)+'</td><td>'+g(x.diff)+'</td><td>'+g(x.msb)+'</td><td>'+g(x.z)+'</td><td>'+outs+'</td></tr>';
      }).join('') || '<tr><td colspan="11">Pulse Siguiente para ejecutar el primer ciclo.</td></tr>';
    }
  }
  function go(n){ idx=Math.max(0,Math.min(steps.length-1,n)); render(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; $('bplay').textContent='Reproducir'; } }
  SCENES.forEach((n,i) => { const li=document.createElement('li'), bt=document.createElement('button');
    bt.type='button'; bt.textContent=(i+1)+' '+n; bt.addEventListener('click', () => { stop(); go(steps.findIndex(s => s.sc===i+1)); });
    li.appendChild(bt); $('scenes').appendChild(li); });
  $('bnext').addEventListener('click', () => { stop(); go(idx+1); });
  $('bprev').addEventListener('click', () => { stop(); go(idx-1); });
  $('bfirst').addEventListener('click', () => { stop(); go(0); });
  $('bplay').addEventListener('click', () => { if(timer){ stop(); return; } if(idx===steps.length-1) go(0);
    $('bplay').textContent='Pausa'; timer=setInterval(() => { if(idx>=steps.length-1){ stop(); return; } go(idx+1); }, 3200); });
  document.addEventListener('keydown', e => { if(e.target.tagName==='INPUT') return;
    if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); stop(); go(idx+1); }
    if(e.key==='ArrowLeft'){ e.preventDefault(); stop(); go(idx-1); } });
  $('inA').addEventListener('change', () => { stop(); build(); go(base.length-1); });
  build(); render();
})();
</script>
