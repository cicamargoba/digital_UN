    {sc:2, add:['o-main'], hl:['f-main','t-gcc','o-main'], v:['file','main.o','objdump -dr',/R_RISCV/], t:'gcc -c main.c → main.o',
     d:'main.o no puede saber dónde está hw_mult ni dónde quedarán llamadas y resultado: deja la instrucción con un hueco y una reubicación (R_RISCV_CALL_PLT, R_RISCV_HI20, R_RISCV_LO12) para que el enlazador la complete. Sus secciones son .text.startup (main, 52 B), .srodata, .sdata y .sbss (4 B cada una).'},
    {sc:2, add:['o-start'], hl:['f-start','t-gcc','o-start'], v:['file','start.o','objdump -dr',/R_RISCV|li|jalr|auipc/], t:'gcc -c start.S → start.o',
     d:'start.S ya está en ensamblador: el ensamblador lo convierte en start.o (16 B de .text). La llamada a main también queda pendiente de reubicación.'},
    {sc:3, add:['f-ld','a-obj','t-ld'], hl:['f-ld','t-ld'], v:['file','bram.ld','script del enlazador',[3,7,8,9,10]], t:'bram.ld: dónde va cada cosa',
     d:'El script del enlazador describe la memoria (BRAM: desde 0x0000, 0x400 = 1 KB) y el orden de las secciones. start.o (.text) va primero para que _start quede en 0x0000, la dirección en la que la CPU empieza después del reset. Luego van .text, .rodata, .data y .bss.'},
    {sc:3, add:['a-ld','elf'], hl:['t-ld','elf','o-hw','o-main','o-start'], v:['sym'], t:'ld → firmware.elf',
     d:'El enlazador une los tres objetos, asigna una dirección a cada símbolo y completa las reubicaciones: la llamada a hw_mult queda como jal 0x34 y llamadas se lee en 0x78. El resultado es firmware.elf, un ejecutable con el código, los datos y la información de cada sección.'},
    {sc:3, add:['a-elf','sec-text'], hl:['sec-text'], v:['hex',null,'.text'], t:'.text: el código',
     d:'.text contiene las instrucciones de _start (0x00), main (0x0C) y hw_mult (0x34): 116 bytes, 29 instrucciones. Es de solo lectura y ejecución.'},
    {sc:3, add:['sec-rod'], hl:['sec-rod'], v:['hex',0x74,'.rodata'], t:'.rodata: constantes',
     d:'.rodata guarda los datos constantes: operandos = {5, 3} en 0x74, dos valores de 16 bits en una palabra. Con -O2 el compilador usó los valores directamente (li a0,5 y li a1,3), pero la constante sigue en el ejecutable porque es global.'},
    {sc:3, add:['sec-data'], hl:['sec-data'], v:['hex',0x78,'.data'], t:'.data: variables con valor inicial',
     d:'.data guarda las variables globales inicializadas: llamadas = 1 en 0x78. Su valor inicial forma parte del archivo, así que llega a la RAM antes de que el programa arranque.'},
    {sc:3, add:['sec-bss'], hl:['sec-bss'], v:['hex',0x7C,'.bss'], t:'.bss: variables sin valor inicial',
     d:'.bss reserva espacio para las globales sin valor inicial: resultado en 0x7C. En el ELF no ocupa bytes, solo se indica su tamaño (NOBITS); el lenguaje C exige que empiece en 0. En este firmware.hex esa palabra va como 00000000.'},
    {sc:4, add:['a-sec','t-words','a-words','hex'], hl:['t-words','hex'], v:['hex',null,null], t:'firmware_words → firmware.hex',
     d:'firmware_words toma la imagen de memoria del ELF y la escribe como texto: una palabra de 32 bits en hexadecimal por línea, en el formato que lee $readmemh. La línea n es la dirección 4·n. Los bytes de cada palabra están en orden little endian: operandos = {5, 3} se lee 00030005.'},
    {sc:5, add:['soc-ram'], hl:['a-readmem','ram'], v:['hex',null,null,'ram'], t:'$readmemh: el firmware entra a la RAM',
     d:'bram.v carga firmware.hex con $readmemh dentro de un initial. En simulación lo hace al empezar. En síntesis, yosys convierte esas palabras en el contenido inicial de la BRAM y el bitstream lo lleva a la FPGA: al configurarla, la memoria de programa ya contiene el firmware.'},
    {sc:5, fetch:0x00, v:['hex',0x00,null,'ram'], t:'Reset: la CPU lee la primera instrucción',
     d:'Después del reset, el PC de femtorv32 vale 0x0000. La CPU pone esa dirección en mem_addr y activa rd; el decodificador activa cs0, la RAM entrega MEM[0] = 40000113 y el multiplexor la lleva por la entrada 1 a mem_rdata: li sp, 1024.'},
    {sc:5, fetch:0x04, v:['hex',0x04,null,'ram'], t:'0x04: jal main',
     d:'La CPU lee 0x04: jal main salta a 0x0C. Cada instrucción se busca igual, por el mismo bus y con cs0.'},
    {sc:5, fetch:0x1C, v:['hex',0x1C,null,'ram'], t:'0x1C: jal hw_mult',
     d:'main carga 5 y 3 en a0 y a1 y en 0x1C salta a hw_mult (0x34): la dirección que el enlazador completó.'},
    {sc:5, fetch:0x38, v:['hex',0x38,null,'ram'], t:'0x38: la primera escritura al multiplicador',
     d:'En 0x38 está sw a0, 4(a2): la instrucción sale de la RAM, pero su escritura va a 0x420004 con cs3. Desde aquí sigue la secuencia de accesos al multiplicador de la animación anterior.'},
    {sc:5, fetch:0x20, data:0x78, v:['hex',0x78,null,'ram'], t:'De vuelta en main: lectura de .data',
     d:'Al volver, main lee llamadas en 0x78. Es una lectura de datos en la RAM, también con cs0: el valor 1 que llegó desde .data.'},
    {sc:5, fetch:0x24, data:0x7C, wr:15, v:['hex',0x7C,null,'ram'], t:'Escritura de resultado en .bss',
     d:'sw a0, 124(zero) guarda 15 en resultado (0x7C, en .bss). Así, el firmware que salió de main.c usa las cuatro secciones: código en .text, constantes en .rodata, datos iniciales en .data y variables en .bss.'},
  ];
  let vis = new Set(); S.forEach(s => { (s.add||[]).forEach(k => vis.add(k)); s.vis = new Set(vis); });
  const EL = Array.from(document.querySelectorAll('#flow .el')).map(e => e.id);
  const ALLG = Array.from(document.querySelectorAll('#flow g[id]')).map(e => e.id);
  let idx = 0, timer = null;
  function render(){
    const s = S[idx];
    EL.forEach(id => $(id).classList.toggle('on', s.vis.has(id)));
    const act = new Set(s.hl||[]);
    const ex = s.fetch!==undefined;
    if(ex) ['cpu','b-addr','b-dec','dec','b-cs','b-rd','ram','b-dout','mux','b-rdata'].forEach(k => act.add(k));
    ALLG.forEach(id => $(id).classList.toggle('act', act.has(id)));
    const a = ex ? (s.data!==undefined ? s.data : s.fetch) : null;
    $('v-pc').textContent = ex ? 'PC = 0x'+s.fetch.toString(16).toUpperCase().padStart(2,'0') : '';
    $('v-addr').textContent = ex ? '= 0x'+a.toString(16).toUpperCase().padStart(8,'0') : '';
    $('v-rd').textContent = ex ? (s.wr!==undefined ? 'wr = 1' : 'rd = 1') : '';
    const row = ex ? ROWS.find(r => r.a===a) : null;
    $('v-rdata').textContent = ex && s.wr===undefined ? '= '+row.w : '';
    ['file','sym','hex'].forEach(v => $('v-'+v).classList.toggle('on', s.v[0]===v));
    if(s.v[0]==='file') showFile(s.v[1], s.v[2], s.v[3]);
    if(s.v[0]==='sym') $('symbody').innerHTML = SYMS.map(r => '<tr class="hl"><td>'+r[0]+'</td><td>'+r[1]+'</td><td class="s-'+r[2].slice(1)+'">'+r[2]+'</td></tr>').join('');
    if(s.v[0]==='hex') showHex(s.v[1], s.v[2], s.v[3]);
    $('eyebrow').textContent = 'Escena '+s.sc+' · '+SCENES[s.sc-1];
    $('stitle').textContent = s.t; $('stext').textContent = s.d;
    $('count').textContent = 'Paso '+(idx+1)+' de '+S.length;
    $('bprev').disabled = idx===0; $('bnext').disabled = idx===S.length-1;
    document.querySelectorAll('#scenes button').forEach((bt,i) => bt.setAttribute('aria-current', String(i+1===s.sc)));
  }
  function go(n){ idx = Math.max(0, Math.min(S.length-1, n)); render(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; $('bplay').textContent='Reproducir'; } }
  SCENES.forEach((n,i) => { const li=document.createElement('li'), bt=document.createElement('button');
    bt.type='button'; bt.textContent=(i+1)+' '+n; bt.addEventListener('click', () => { stop(); go(S.findIndex(s => s.sc===i+1)); });
    li.appendChild(bt); $('scenes').appendChild(li); });
  $('bnext').addEventListener('click', () => { stop(); go(idx+1); });
  $('bprev').addEventListener('click', () => { stop(); go(idx-1); });
  $('bfirst').addEventListener('click', () => { stop(); go(0); });
  $('bplay').addEventListener('click', () => { if(timer){ stop(); return; } if(idx===S.length-1) go(0);
    $('bplay').textContent='Pausa'; timer=setInterval(() => { if(idx>=S.length-1){ stop(); return; } go(idx+1); }, 4000); });
  document.addEventListener('keydown', e => {
    if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); stop(); go(idx+1); }
    if(e.key==='ArrowLeft'){ e.preventDefault(); stop(); go(idx-1); } });
  render();
})();
</script>
